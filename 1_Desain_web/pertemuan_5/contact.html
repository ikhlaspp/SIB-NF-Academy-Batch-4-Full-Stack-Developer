<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
        .contact-info { background: #1a1a1a; color: #d4cdc0; border-radius: 12px; padding: 28px 30px; }
        .contact-info h3 { color: #c9b99a; font-size: 1rem; margin-bottom: 20px; }
        .contact-info p { font-size: 0.85rem; margin-bottom: 14px; line-height: 1.85; }
        .contact-form { background: #fff; border-radius: 12px; padding: 28px 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
        .contact-form h3 { color: #1a1a1a; font-size: 1rem; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input,
        .form-group textarea {
            width: 100%; padding: 10px 12px;
            border: 1px solid #e0dbd4; border-radius: 6px;
            font-family: 'Poppins', sans-serif; font-size: 0.85rem; color: #333;
            background: #faf9f7; transition: border-color 0.2s; box-sizing: border-box;
        }
        .form-group input:focus,
        .form-group textarea:focus { outline: none; border-color: #c9b99a; }
        .form-group textarea { height: 95px; resize: vertical; }
    </style>
</head>
<body class="page-shell">
    <h2 class="section-title">Contact Us</h2>
    <div class="contact-grid">
        <div class="contact-info">
            <h3>Get in Touch</h3>
            <p>📧 hello@nusantarafragrance.id</p>
            <p>📱 +62 812 3456 7890</p>
            <p>📍 Jl. Raya Darmo No. 88<br>&nbsp;&nbsp;&nbsp;&nbsp;Surabaya, Jawa Timur 60241</p>
            <p>🕐 Mon–Fri: 09.00 – 18.00 WIB</p>
        </div>
        <div class="contact-form">
            <h3>Send a Message</h3>
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Your full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea placeholder="Write your message here..."></textarea>
            </div>
            <a href="#" class="btn">Send Message</a>
        </div>
    </div>
</body>
</html>
