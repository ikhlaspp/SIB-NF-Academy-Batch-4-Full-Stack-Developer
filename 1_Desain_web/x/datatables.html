        .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:1rem}

        .toolbar .form-control:focus,.toolbar .form-select:focus{border-color:#c9a84c;box-shadow:0 0 0 .15rem rgba(201,168,76,.25);background:#2a2a2a;color:#fff}

        .sort-icon.active-sort{opacity:1;color:#c9a84c}

    </style>

                <option value="Sistem Informasi">Sistem Informasi</option>
                <option value="Teknik Komputer">Teknik Komputer</option>
                <option value="Data Science">Data Science</option>
            </select>
            <select class="form-select form-select-sm" id="filterSemester" style="width:auto;min-width:140px">

                <option value="2">Semester 2</option>
                <option value="4">Semester 4</option>
                <option value="6">Semester 6</option>
                <option value="8">Semester 8</option>
            </select>
            <select class="form-select form-select-sm" id="filterStatus" style="width:auto;min-width:130px">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="On Leave">On Leave</option>
                <option value="Graduated">Graduated</option>
            </select>
            <button class="btn btn-gold btn-sm" onclick="exportCSV()">

            </button>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-striped table-hover dark-table align-middle mb-0" id="dataTable">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">No <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th onclick="sortTable(1)">NIM <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th onclick="sortTable(2)">Name <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th onclick="sortTable(3)">Major <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th onclick="sortTable(4)">Semester <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th onclick="sortTable(5)">City <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th onclick="sortTable(6)">GPA <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th onclick="sortTable(7)">Status <i class="bi bi-arrow-down-up sort-icon"></i></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- Pagination & Info -->
        <div class="table-info-bar">
            <span id="tableInfo">Showing 1-10 of 75 entries</span>
            <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm" id="perPage" style="width:auto;background:#222;border:1px solid #444;color:#ccc;font-size:.82rem" onchange="changePage(1)">
                    <option value="10">10 / page</option>
                    <option value="25">25 / page</option>
                    <option value="50">50 / page</option>
                    <option value="100">100 / page</option>
                </select>
                <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
            </div>
        </div>
    </div>
</div>

// ===== STATE =====
let filtered = [...students];
let currentPage = 1;
let sortCol = -1;
let sortAsc = true;

// ===== RENDER TABLE =====
function renderTable() {
    const perPage = parseInt(document.getElementById('perPage').value);
    const start = (currentPage - 1) * perPage;
    const pageData = filtered.slice(start, start + perPage);
    const tbody = document.getElementById('tableBody');

    if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4" style="color:#888"><i class="bi bi-inbox me-2" style="font-size:1.5rem"></i>No matching records found</td></tr>';
    } else {
        tbody.innerHTML = pageData.map((s, i) => {
            const statusClass = s.status === 'Active' ? 'background:#c9a84c;color:#0f0f0f' :
                                s.status === 'Graduated' ? 'background:#198754;color:#fff' :
                                'background:#6c757d;color:#fff';
            return `<tr>
                <td>${start + i + 1}</td>
                <td>${s.nim}</td>
                <td>${s.name}</td>
                <td>${s.major}</td>
                <td>${s.sem}</td>
                <td>${s.city}</td>
                <td>${s.gpa.toFixed(2)}</td>
                <td><span class="badge" style="${statusClass}">${s.status}</span></td>
            </tr>`;
        }).join('');
    }

    // Info text
    const total = filtered.length;
    const end = Math.min(start + perPage, total);
    document.getElementById('tableInfo').textContent = total === 0
        ? 'No entries found'
        : `Showing ${start + 1}-${end} of ${total} entries`;

    renderPagination();
}

// ===== PAGINATION =====
function renderPagination() {
    const perPage = parseInt(document.getElementById('perPage').value);
    const totalPages = Math.ceil(filtered.length / perPage) || 1;
    const ul = document.getElementById('pagination');
    let html = '';

    html += `<li class="page-item ${currentPage===1?'disabled':''}"><a class="page-link" href="#" onclick="changePage(${currentPage-1});return false">&laquo;</a></li>`;

    let startP = Math.max(1, currentPage - 2);
    let endP = Math.min(totalPages, startP + 4);
    if (endP - startP < 4) startP = Math.max(1, endP - 4);

    for (let p = startP; p <= endP; p++) {
        html += `<li class="page-item ${p===currentPage?'active':''}"><a class="page-link" href="#" onclick="changePage(${p});return false">${p}</a></li>`;
    }

    html += `<li class="page-item ${currentPage===totalPages?'disabled':''}"><a class="page-link" href="#" onclick="changePage(${currentPage+1});return false">&raquo;</a></li>`;
    ul.innerHTML = html;
}

function changePage(p) {
    const perPage = parseInt(document.getElementById('perPage').value);
    const totalPages = Math.ceil(filtered.length / perPage) || 1;
    currentPage = Math.max(1, Math.min(p, totalPages));
    renderTable();
}

// ===== SEARCH & FILTER =====
function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const major = document.getElementById('filterMajor').value;
    const sem = document.getElementById('filterSemester').value;
    const status = document.getElementById('filterStatus').value;

    filtered = students.filter(s => {
        const matchSearch = !search || s.name.toLowerCase().includes(search) ||
            s.nim.includes(search) || s.city.toLowerCase().includes(search) ||
            s.major.toLowerCase().includes(search);
        const matchMajor = !major || s.major === major;
        const matchSem = !sem || s.sem === parseInt(sem);
        const matchStatus = !status || s.status === status;
        return matchSearch && matchMajor && matchSem && matchStatus;
    });

    // Re-apply sort if active
    if (sortCol >= 0) applySortToFiltered();

    currentPage = 1;
    renderTable();
}

// ===== SORTING =====
function sortTable(colIdx) {
    if (sortCol === colIdx) {
        sortAsc = !sortAsc;
    } else {
        sortCol = colIdx;
        sortAsc = true;
    }
    applySortToFiltered();
    renderTable();

    // Highlight sort icon
    document.querySelectorAll('.sort-icon').forEach((el, i) => {
        el.classList.toggle('active-sort', i === colIdx);
        el.className = el.className.replace(/bi-arrow-(up|down)\b/g, 'bi-arrow-down-up');
        if (i === colIdx) {
            el.classList.remove('bi-arrow-down-up');
            el.classList.add(sortAsc ? 'bi-arrow-up' : 'bi-arrow-down');
        }
    });
}

function applySortToFiltered() {
    const keys = ['_no','nim','name','major','sem','city','gpa','status'];
    const key = keys[sortCol];
    if (key === '_no') return;

    filtered.sort((a, b) => {
        let va = a[key], vb = b[key];
        if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
        if (va < vb) return sortAsc ? -1 : 1;
        if (va > vb) return sortAsc ? 1 : -1;
        return 0;
    });
}

// ===== CSV EXPORT =====
function exportCSV() {
    const headers = ['No','NIM','Name','Major','Semester','City','GPA','Status'];
    const rows = filtered.map((s, i) => [i+1, s.nim, s.name, s.major, s.sem, s.city, s.gpa.toFixed(2), s.status]);
    let csv = headers.join(',') + '\n';
    rows.forEach(r => {
        csv += r.map(v => `"${v}"`).join(',') + '\n';
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'student_data.csv';
    link.click();
    URL.revokeObjectURL(link.href);
}

// ===== INIT =====
document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('filterMajor').addEventListener('change', applyFilters);
document.getElementById('filterSemester').addEventListener('change', applyFilters);
document.getElementById('filterStatus').addEventListener('change', applyFilters);

renderTable();
</script>
