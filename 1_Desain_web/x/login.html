<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="inner-page">

    <div class="container py-3">
        <div class="login-wrapper">
            <!-- Login Card -->
            <div class="login-card text-center">
                <div class="mb-4">
                    <i class="bi bi-shield-lock login-icon"></i>
                    <h3 class="fw-bold mt-2" style="color:#c9a84c;">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your account</p>
                </div>

                <form class="dark-form text-start" onsubmit="handleLogin(event)">
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope me-1"></i>Email Address
                        </label>
                        <input type="email" class="form-control" id="email" 
                               placeholder="Enter your email" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-key me-1"></i>Password
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" 
                                   placeholder="Enter your password" required
                                   style="border-right:none;">
                            <button class="btn" type="button" onclick="togglePassword()"
                                    style="background:#222; border:1px solid #444; border-left:none; color:#999;">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label small" for="remember" style="color:#999;">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="small" style="color:#c9a84c;">Forgot password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-gold w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>

                    <!-- Divider -->
                    <div class="text-center my-3">
                        <span class="small" style="color:#666;">or sign in with</span>
                    </div>

                    <!-- Social Login -->
                    <div class="d-flex gap-2 justify-content-center mb-3">
                        <button type="button" class="btn btn-outline-gold btn-sm px-3">
                            <i class="bi bi-google me-1"></i>Google
                        </button>
                        <button type="button" class="btn btn-outline-gold btn-sm px-3">
                            <i class="bi bi-github me-1"></i>GitHub
                        </button>
                    </div>

                    <!-- Register Link -->
                    <p class="text-center small mt-3 mb-0" style="color:#888;">
                        Don't have an account? 
                        <a href="#" style="color:#c9a84c; font-weight:600;">Sign Up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Alert for demo login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content" style="background:#1e1e1e; border:1px solid #c9a84c; border-radius:12px;">
                <div class="modal-body text-center p-4">
                    <i class="bi bi-check-circle" style="font-size:3rem; color:#c9a84c;"></i>
                    <h5 class="mt-2 fw-bold" style="color:#c9a84c;">Login Successful!</h5>
                    <p class="small text-muted">Welcome back to your account.</p>
                    <button class="btn btn-gold btn-sm" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword() {
            const pw = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                pw.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        // Handle login form submit (demo)
        function handleLogin(e) {
            e.preventDefault();
            const modal = new bootstrap.Modal(document.getElementById('loginModal'));
            modal.show();
        }
    </script>
</body>
</html>
