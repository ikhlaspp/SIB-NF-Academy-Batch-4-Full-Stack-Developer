<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RWD Master Access</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page {
            background: linear-gradient(135deg, #f0f2f5 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            background: white;
        }
        .login-banner {
            background: linear-gradient(rgba(67, 97, 238, 0.8), rgba(63, 55, 201, 0.8)), url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80');
            background-size: cover;
            background-position: center;
            padding: 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-control {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #eee;
            background: #f8f9fa;
        }
        .form-control:focus {
            background: white;
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.1);
            border-color: var(--primary-color);
        }
        .social-btn {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #eee;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            text-decoration: none;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        .social-btn:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="login-card shadow-lg">
                    <div class="row g-0">
                        <div class="col-md-5 d-none d-md-flex login-banner">
                            <h2 class="fw-bold mb-3">Selamat Datang Kembali!</h2>
                            <p class="opacity-75 mb-4">Masuk untuk melanjutkan perjalanan belajar Anda di platform desain web terbaik.</p>
                            <div class="mt-auto">
                                <a href="index.html" class="text-white text-decoration-none small d-flex align-items-center">
                                    <i class="bi bi-arrow-left me-2"></i> Kembali ke Beranda
                                </a>
                            </div>
                        </div>
                        <div class="col-md-7 p-4 p-lg-5">
                            <div class="text-center text-md-start mb-4">
                                <h3 class="fw-bold mb-1">Login Akun</h3>
                                <p class="text-muted small">Silakan masukkan kredensial Anda untuk mengakses dashboard.</p>
                            </div>

                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Username atau Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-0"><i class="bi bi-person text-muted"></i></span>
                                        <input type="text" class="form-control" placeholder="admin@example.com" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between">
                                        <label class="form-label small fw-bold">Password</label>
                                        <a href="#" class="small text-decoration-none">Lupa Password?</a>
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
                                        <input type="password" class="form-control" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <div class="mb-4 form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label small" for="remember">Ingat perangkat ini</label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mb-4 shadow-sm">
                                    Masuk Sekarang <i class="bi bi-box-arrow-in-right ms-2"></i>
                                </button>
                            </form>

                            <div class="position-relative mb-4">
                                <hr class="opacity-10">
                                <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">Atau masuk dengan</span>
                            </div>

                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <a href="#" class="social-btn">
                                        <i class="bi bi-google text-danger"></i> Google
                                    </a>
                                </div>
                                <div class="col-sm-6">
                                    <a href="#" class="social-btn">
                                        <i class="bi bi-github text-dark"></i> GitHub
                                    </a>
                                </div>
                            </div>

                            <div class="text-center mt-5">
                                <p class="small text-muted">Belum punya akun? <a href="#" class="fw-bold text-decoration-none">Daftar Gratis</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Simulasi Login Berhasil!\nMengarahkan ke halaman utama...');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
