<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Nusantara Fragrance</title>
</head>
<body class="iframe-container">

    <div class="iframe-layout">

        <!-- HEADER FRAME -->
        <iframe src="header.html"
                class="if-header"
                scrolling="no"
                frameborder="0"
                title="Header"></iframe>

        <!-- NAV FRAME -->
        <iframe src="nav.html"
                class="if-nav"
                scrolling="no"
                frameborder="0"
                title="Navigation"></iframe>

        <!-- BODY ROW -->
        <div class="if-body-wrapper">
            <div class="if-body">

                <!-- LEFT SIDEBAR FRAME -->
                <iframe src="sidebar-left.html"
                        class="if-sidebar"
                        scrolling="auto"
                        frameborder="0"
                        title="Left Sidebar"></iframe>

                <!-- MAIN CONTENT FRAME (target for nav links) -->
                <iframe src="home.html"
                        name="main-frame"
                        class="if-main"
                        scrolling="auto"
                        frameborder="0"
                        title="Main Content"></iframe>

                <!-- RIGHT SIDEBAR FRAME -->
                <iframe src="sidebar-right.html"
                        class="if-sidebar"
                        scrolling="auto"
                        frameborder="0"
                        title="Right Sidebar"></iframe>

            </div>
        </div>

        <!-- FOOTER FRAME -->
        <iframe src="footer.html"
                class="if-footer"
                scrolling="no"
                frameborder="0"
                title="Footer"></iframe>

    </div>

</body>
</html>
